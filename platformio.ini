; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = ST7735-PCMonitor
description = PC Stats Monitor with WiFi Portal - ESP32-S3 Super Mini (4 MB) + ST7735 160x128 TFT
default_envs = esp32-s3-supermini
boards_dir = boards

[env:esp32-s3-supermini]
platform = espressif32
board = esp32-s3-supermini-4m
framework = arduino
monitor_speed = 115200
monitor_filters = direct
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
; Partition table: min_spiffs gives ~1.9MB per OTA slot (SPIFFS unused anyway).
; Required when BLE_SETUP_ENABLED = 1 to fit NimBLE (~200KB) alongside OTA.
board_build.partitions = min_spiffs.csv
lib_deps =
	tzapu/WiFiManager@^2.0.17
	adafruit/Adafruit GFX Library@^1.12.4
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	bblanchon/ArduinoJson@^7.4.2
	ricmoo/QRCode@^0.0.1
	; BLE provisioning (NimBLE is ~200KB; dead-stripped by linker when BLE_SETUP_ENABLED = 0)
	h2zero/NimBLE-Arduino@^1.4.2
	; Improv-Serial WiFi push for the web flasher (tiny; stripped when IMPROV_SETUP_ENABLED = 0)
	jnthas/Improv WiFi Library@^0.0.2

; ST7735 release build; the 160x128 TFT uses SPI and DISPLAY_TYPE 3.
[env:st7735-160x128]
extends = env:esp32-s3-supermini
build_flags =
	${env:esp32-s3-supermini.build_flags}
	-DDISPLAY_TYPE=3
